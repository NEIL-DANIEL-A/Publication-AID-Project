name: Scopus Daily Scraper

on:
  schedule:
    # 8:30 PM IST (20:30 IST) is 15:00 UTC (UTC + 5:30)
    - cron: '0 15 * * *'
  workflow_dispatch: {} # Manual trigger button in GitHub Actions tab

jobs:
  scrape-scopus:
    name: Scrape Scopus & Sync Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas supabase openpyxl scrapling playwright
          scrapling install
          playwright install chromium --with-deps

      - name: Run Scopus scraper pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scopus/fetch_and_push_12k.py
